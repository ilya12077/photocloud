# GitHub recommends pinning actions to a commit SHA.
# To get a newer version, you will need to update the SHA.
# You can also reference a tag or branch, but the action may change without warning.

name: Publish Docker image

on:
  release:
    types: [published]
  # Изменение интерфейса тоже запускает сборку, даже при возврате к старой версии.
  # master -> теги <версия> и latest; beta -> только beta.
  push:
    branches: [master, beta]
    paths:
      - app/VERSION
      - app/static/**
      - tests/gallery_days_browser.cjs
      - .github/workflows/main.yml

jobs:
  gallery_layout:
    uses: ./.github/workflows/gallery-layout.yml
  windows_agent:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install httpx pillow cryptography watchdog
      - run: python -m unittest discover -s tests -p test_pc_startup.py -v
      - run: python -m unittest discover -s tests -p test_backup_pipe.py -v

  push_to_registry:
    needs: [windows_agent, gallery_layout]
    name: Build and publish to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      tags: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check syntax and offline regression tests
        run: |
          python -m pip install -r app/requirements.txt
          python -m compileall -q app
          node --check app/static/app.js
          python -m unittest discover -s tests -v

      - name: Start PhotoCloud and check HTTP responses
        run: |
          mkdir -p "$RUNNER_TEMP/photos"
          export STORAGE=local LOCAL_ROOT="$RUNNER_TEMP/photos" DATA_DIR="$RUNNER_TEMP/photocloud-data" REQUIRE_PROXY=false
          python -m uvicorn app.main:app --host 127.0.0.1 --port 18099 > "$RUNNER_TEMP/server.log" 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          curl --retry 20 --retry-connrefused --retry-delay 1 -fsS http://127.0.0.1:18099/admin -o "$RUNNER_TEMP/admin.html" || { tail -30 "$RUNNER_TEMP/server.log" | sed '/setup=/d'; exit 1; }
          grep -q 'id="bk-tokens"' "$RUNNER_TEMP/admin.html"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18099/api/pc/marks)" = 401

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@f4ef78c080cd8ba55a85445d5b36e214a81df20a
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read version
        id: ver
        run: echo "version=$(tr -d ' \r\n' < app/VERSION)" >> "$GITHUB_OUTPUT"

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@9ec57ed1fcdbf14dcef7dfbe97b2010124a938b7
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=raw,value=${{ steps.ver.outputs.version }},enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
            type=raw,value=latest,enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
            type=raw,value=beta,enable=${{ github.ref == 'refs/heads/beta' }}
          labels: |
            org.opencontainers.image.version=${{ steps.ver.outputs.version }}
      
      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@3b5e8027fcad23fda98b2e3ac259d8d67585f671
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.ver.outputs.version }}

  mirror_to_dockerhub:
    name: Optional mirror to Docker Hub
    needs: push_to_registry
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    permissions:
      contents: read
      packages: read
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@f4ef78c080cd8ba55a85445d5b36e214a81df20a
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Log in to Docker Hub
        uses: docker/login-action@f4ef78c080cd8ba55a85445d5b36e214a81df20a
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Copy the tested image without rebuilding
        env:
          SOURCE_IMAGE: ghcr.io/${{ github.repository }}@${{ needs.push_to_registry.outputs.digest }}
          SOURCE_TAGS: ${{ needs.push_to_registry.outputs.tags }}
        run: |
          docker pull "$SOURCE_IMAGE"
          while IFS= read -r source_tag; do
            [ -n "$source_tag" ] || continue
            target="ilya1207/photocloud:${source_tag##*:}"
            docker tag "$SOURCE_IMAGE" "$target"
            docker push "$target"
          done <<< "$SOURCE_TAGS"
      - name: Report mirror failure
        if: failure()
        run: echo '::warning::Docker Hub mirror failed. The tested image is already available in GHCR.'
