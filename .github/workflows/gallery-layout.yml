name: Gallery layout in browser
on:
  workflow_call:
  push:
    branches: [test/gallery-day-captions]
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser and server
        run: |
          python -m pip install -r app/requirements.txt
          npm install --prefix "$RUNNER_TEMP/gallery-tools" playwright@1.62.1
          "$RUNNER_TEMP/gallery-tools/node_modules/.bin/playwright" install --with-deps chromium
      - name: Check gallery against running PhotoCloud
        env:
          GALLERY_TEST_URL: http://127.0.0.1:19872
          GALLERY_SCREENSHOTS: ${{ runner.temp }}/gallery-screenshots
        run: |
          export NODE_PATH="$RUNNER_TEMP/gallery-tools/node_modules"
          export PYTHONPATH="$PWD"
          python tests/gallery_days_fixture.py "$RUNNER_TEMP/gallery-fixture"
          export STORAGE=local LOCAL_ROOT="$RUNNER_TEMP/gallery-fixture/media" DATA_DIR="$RUNNER_TEMP/gallery-fixture/data" REQUIRE_PROXY=false COOKIE_SECURE=false
          python -m uvicorn app.main:app --host 127.0.0.1 --port 19872 > "$RUNNER_TEMP/gallery-server.log" 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          curl --retry 20 --retry-connrefused --retry-delay 1 -fsS "$GALLERY_TEST_URL/admin" -o /dev/null
          node tests/gallery_days_browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gallery-layout-screenshots
          path: ${{ runner.temp }}/gallery-screenshots
